<!doctype html>
<html lang="es">
<head>

<title>Flare broken fixture — no CTA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: system-ui, sans-serif; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column;
           align-items: center; justify-content: center; text-align: center; color: #fff; padding: 80px; }

<!-- Deliberately broken: identical structure to the good fixture but the
     CTA element has been removed, so lint must fail and score must refuse. -->

  <section class="scene" data-scene="escena-1" data-start="0" data-duration="1.5" data-bg="#7c2d12">
    <div class="hook" data-caption data-start="0" data-duration="1.5" style="font-size:96px">¿CAFÉ FRÍO<br>OTRA VEZ?</div>
  </section>
  <section class="scene" data-scene="escena-2" data-start="1.5" data-duration="1.5" data-bg="#0f766e">
    <div class="hook" style="font-size:72px">CAFÉ NÓMADA</div>
    <div class="caption" data-caption data-start="1.5" data-duration="1.5" style="font-size:40px">Caliente hasta la última gota</div>
  </section>

</html>
